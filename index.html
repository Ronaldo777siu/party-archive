<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>党务档案管理系统 · 登录</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-head">
        <span class="badge">党旗领航 · 档案育人</span>
        <h1>党务档案管理系统</h1>
        <p>F · 第6届党务 · 档案管理</p>
      </div>
      <div class="login-body">
        <div class="error-msg" id="errorMsg"></div>
        <div class="field">
          <label>账号</label>
          <input type="text" id="username" placeholder="请输入账号" autocomplete="username">
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <p class="login-tip">登录即表示您已获授权访问党务档案数据，请妥善保管账号信息。</p>
        <button class="btn btn-primary btn-block" id="loginBtn">登 录</button>
      </div>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
